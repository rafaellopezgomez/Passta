name: Build platform JARs

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            suffix: linux-x64

          - name: Windows x64
            runner: windows-2025
            suffix: windows-x64

          - name: macOS ARM64
            runner: macos-26
            suffix: macos-arm64

          - name: macOS Intel
            runner: macos-26-intel
            suffix: macos-x64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show build environment
        shell: bash
        run: |
          java --version
          mvn --version
          uname -a || true

      - name: Build with Maven
        shell: bash
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Rename platform artifact
        shell: bash
        run: |
          mv \
            dist/passta-0.4.0.jar \
            dist/passta-0.4.0-${{ matrix.suffix }}.jar

      - name: Test executable JAR
        shell: bash
        run: |
          java \
            -jar dist/passta-0.4.0-${{ matrix.suffix }}.jar \
            --help

      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: passta-0.4.0-${{ matrix.suffix }}
          path: dist/passta-0.4.0-${{ matrix.suffix }}.jar
          if-no-files-found: error
          retention-days: 30
